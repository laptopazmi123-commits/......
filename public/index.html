<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirim WA Otomatis</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <header class="card-header">
      <h1>📤 Kirim WA Otomatis</h1>
      <p class="subtitle">Teks · Foto · Video · via Fonnte</p>
    </header>

    <form id="form" class="form" autocomplete="off" enctype="multipart/form-data">
      <div class="field">
        <label for="target">Nomor Tujuan</label>
        <input id="target" name="target" type="tel" placeholder="6281234567890" value="62">
        <small>Format internasional tanpa + atau spasi</small>
      </div>

      <div class="field">
        <label for="message">Pesan (caption)</label>
        <textarea id="message" name="message" rows="3" placeholder="Tulis pesan...">Halo, ini pesan otomatis</textarea>
        <small><span id="charCount">0</span> karakter</small>
      </div>

      <div class="field">
        <label for="file">Foto / Video (opsional)</label>
        <input id="file" name="file" type="file" accept="image/*,video/*">
        <small>Maks 4 MB · kosongkan jika hanya teks</small>
      </div>

      <div id="preview" class="preview" style="display:none;">
        <div id="previewInner"></div>
        <button type="button" class="btn-clear" onclick="hapusFile()">✕</button>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="jumlah">Kirim Berapa Kali</label>
          <input id="jumlah" name="jumlah" type="number" min="1" max="50" value="1">
          <small>file yang sama, 1–50x</small>
        </div>
        <div class="field">
          <label for="delay">Delay (detik)</label>
          <input id="delay" name="delay" type="number" min="1" max="60" value="2">
          <small>antar kiriman</small>
        </div>
      </div>

      <button id="btn" type="submit" class="btn-primary">🚀 Kirim Sekarang</button>
    </form>

    <div id="status" class="status"></div>

    <footer class="card-footer">
      <small>Powered by Fonnte · Deploy di Vercel</small>
    </footer>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
